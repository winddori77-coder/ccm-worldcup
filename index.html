<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>나의 CCM 월드컵 32</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;background:linear-gradient(135deg,#f6f2ff,#eef8ff);color:#24213a;min-height:100vh}
.wrap{max-width:1050px;margin:auto;padding:28px 18px 45px} header{text-align:center;margin-bottom:22px}
h1{font-size:clamp(28px,5vw,48px);margin:10px 0 6px} .sub{color:#716b85}
.badge{display:inline-block;background:#6f4bf2;color:white;padding:7px 13px;border-radius:999px;font-weight:700;font-size:13px}
.progress{height:10px;background:#e4def6;border-radius:99px;overflow:hidden;margin:18px 0 26px} .bar{height:100%;width:0;background:#6f4bf2;transition:.35s}
.match{display:grid;grid-template-columns:1fr 70px 1fr;gap:18px;align-items:stretch}
.vs{display:grid;place-items:center;font-weight:900;color:#8c84a5;font-size:22px}
.card{background:#fff;border:2px solid #ebe6f7;border-radius:24px;padding:25px;box-shadow:0 10px 30px #44306b14;display:flex;flex-direction:column;min-height:300px}
.card:hover{transform:translateY(-2px);box-shadow:0 14px 35px #44306b22} .artist{font-size:14px;color:#786d9a;font-weight:700} .title{font-size:27px;font-weight:850;margin:10px 0 20px;line-height:1.3}
.listen{display:block;text-decoration:none;text-align:center;padding:12px;border-radius:13px;background:#f0ecff;color:#5636d7;font-weight:750;margin-bottom:12px}
.choose{border:0;border-radius:14px;padding:14px;background:#6f4bf2;color:#fff;font-size:17px;font-weight:800;cursor:pointer}
.choose:hover{filter:brightness(.95)} .hint{text-align:center;color:#817a93;margin:18px 0}
.result{display:none;text-align:center;background:#fff;border-radius:28px;padding:35px;box-shadow:0 14px 40px #44306b20}
.trophy{font-size:58px} .winner{font-size:clamp(30px,6vw,54px);font-weight:900;margin:12px 0} .again{border:0;background:#24213a;color:#fff;border-radius:14px;padding:14px 24px;font-weight:800;font-size:16px;cursor:pointer}
.note{font-size:13px;color:#8a8497;text-align:center;margin-top:24px;line-height:1.6}
@media(max-width:700px){.match{grid-template-columns:1fr;gap:10px}.vs{height:25px}.card{min-height:0;padding:20px}.title{font-size:23px}}
</style>
</head>
<body>
<div class="wrap">
<header>
<span class="badge">CCM FAVORITE WORLD CUP · 32</span>
<h1>🎵 나의 CCM 월드컵</h1>
<div class="sub">두 곡을 들어보고, 더 좋아하는 한 곡을 선택하세요.</div>
</header>
<div id="game">
<div id="round" style="font-weight:800;text-align:center">32강</div>
<div class="progress"><div class="bar" id="bar"></div></div>
<div class="match">
<div class="card">
<div class="artist" id="aArtist"></div><div class="title" id="aTitle"></div>
<a class="listen" id="aListen" target="_blank" rel="noopener">▶ 유튜브에서 듣기</a>
<button class="choose" onclick="pick(0)">이 곡을 선택 ❤️</button>
</div>
<div class="vs">VS</div>
<div class="card">
<div class="artist" id="bArtist"></div><div class="title" id="bTitle"></div>
<a class="listen" id="bListen" target="_blank" rel="noopener">▶ 유튜브에서 듣기</a>
<button class="choose" onclick="pick(1)">이 곡을 선택 ❤️</button>
</div>
</div>
<div class="hint" id="hint"></div>
</div>
<div class="result" id="result">
<div class="trophy">🏆</div><div>당신이 고른 최고의 CCM</div>
<div class="winner" id="winner"></div>
<div id="winnerArtist" class="sub"></div>
<br>
<a class="listen" id="winnerListen" target="_blank" rel="noopener" style="max-width:360px;margin:18px auto">▶ 우승곡 유튜브에서 듣기</a>
<button class="again" onclick="location.reload()">처음부터 다시 하기</button>
</div>
<div class="note">
※ 유튜브 버튼은 각 곡의 아티스트+곡명 검색 결과로 연결됩니다. 특정 공식 영상으로 고정하고 싶다면 나중에 영상 URL을 넣어 교체할 수 있습니다.
</div>
</div>
<script>
const songs = [{"artist": "위러브", "title": "아름다운 나라", "yt": "https://www.youtube.com/results?search_query=%EC%9C%84%EB%9F%AC%EB%B8%8C%20%EC%95%84%EB%A6%84%EB%8B%A4%EC%9A%B4%20%EB%82%98%EB%9D%BC"}, {"artist": "하니", "title": "행복", "yt": "https://www.youtube.com/results?search_query=%ED%95%98%EB%8B%88%20%ED%96%89%EB%B3%B5"}, {"artist": "김윤진", "title": "아무것도 두려워말라", "yt": "https://www.youtube.com/results?search_query=%EA%B9%80%EC%9C%A4%EC%A7%84%20%EC%95%84%EB%AC%B4%EA%B2%83%EB%8F%84%20%EB%91%90%EB%A0%A4%EC%9B%8C%EB%A7%90%EB%9D%BC"}, {"artist": "달빛마을", "title": "밤이나 낮이나", "yt": "https://www.youtube.com/results?search_query=%EB%8B%AC%EB%B9%9B%EB%A7%88%EC%9D%84%20%EB%B0%A4%EC%9D%B4%EB%82%98%20%EB%82%AE%EC%9D%B4%EB%82%98"}, {"artist": "제이어스", "title": "You Still Love Me", "yt": "https://www.youtube.com/results?search_query=%EC%A0%9C%EC%9D%B4%EC%96%B4%EC%8A%A4%20You%20Still%20Love%20Me"}, {"artist": "어노인팅", "title": "희망의 노래", "yt": "https://www.youtube.com/results?search_query=%EC%96%B4%EB%85%B8%EC%9D%B8%ED%8C%85%20%ED%9D%AC%EB%A7%9D%EC%9D%98%20%EB%85%B8%EB%9E%98"}, {"artist": "예수전도단", "title": "멈출 수 없네", "yt": "https://www.youtube.com/results?search_query=%EC%98%88%EC%88%98%EC%A0%84%EB%8F%84%EB%8B%A8%20%EB%A9%88%EC%B6%9C%20%EC%88%98%20%EC%97%86%EB%84%A4"}, {"artist": "소리엘", "title": "나로부터 시작되리", "yt": "https://www.youtube.com/results?search_query=%EC%86%8C%EB%A6%AC%EC%97%98%20%EB%82%98%EB%A1%9C%EB%B6%80%ED%84%B0%20%EC%8B%9C%EC%9E%91%EB%90%98%EB%A6%AC"}, {"artist": "예림워십", "title": "나의 하나님", "yt": "https://www.youtube.com/results?search_query=%EC%98%88%EB%A6%BC%EC%9B%8C%EC%8B%AD%20%EB%82%98%EC%9D%98%20%ED%95%98%EB%82%98%EB%8B%98"}, {"artist": "마커스", "title": "주님은 산 같아서", "yt": "https://www.youtube.com/results?search_query=%EB%A7%88%EC%BB%A4%EC%8A%A4%20%EC%A3%BC%EB%8B%98%EC%9D%80%20%EC%82%B0%20%EA%B0%99%EC%95%84%EC%84%9C"}, {"artist": "어노인팅", "title": "주님 큰 영광 받으소서", "yt": "https://www.youtube.com/results?search_query=%EC%96%B4%EB%85%B8%EC%9D%B8%ED%8C%85%20%EC%A3%BC%EB%8B%98%20%ED%81%B0%20%EC%98%81%EA%B4%91%20%EB%B0%9B%EC%9C%BC%EC%86%8C%EC%84%9C"}, {"artist": "마커스워십", "title": "주 은혜임을", "yt": "https://www.youtube.com/results?search_query=%EB%A7%88%EC%BB%A4%EC%8A%A4%EC%9B%8C%EC%8B%AD%20%EC%A3%BC%20%EC%9D%80%ED%98%9C%EC%9E%84%EC%9D%84"}, {"artist": "예수전도단", "title": "내 갈급함", "yt": "https://www.youtube.com/results?search_query=%EC%98%88%EC%88%98%EC%A0%84%EB%8F%84%EB%8B%A8%20%EB%82%B4%20%EA%B0%88%EA%B8%89%ED%95%A8"}, {"artist": "어노인팅", "title": "내 구주 예수님", "yt": "https://www.youtube.com/results?search_query=%EC%96%B4%EB%85%B8%EC%9D%B8%ED%8C%85%20%EB%82%B4%20%EA%B5%AC%EC%A3%BC%20%EC%98%88%EC%88%98%EB%8B%98"}, {"artist": "마커스", "title": "예수, 늘 함께 하시네", "yt": "https://www.youtube.com/results?search_query=%EB%A7%88%EC%BB%A4%EC%8A%A4%20%EC%98%88%EC%88%98%2C%20%EB%8A%98%20%ED%95%A8%EA%BB%98%20%ED%95%98%EC%8B%9C%EB%84%A4"}, {"artist": "어노인팅", "title": "예수 열방의 소망", "yt": "https://www.youtube.com/results?search_query=%EC%96%B4%EB%85%B8%EC%9D%B8%ED%8C%85%20%EC%98%88%EC%88%98%20%EC%97%B4%EB%B0%A9%EC%9D%98%20%EC%86%8C%EB%A7%9D"}, {"artist": "제이어스", "title": "나를 향한 주의 사랑", "yt": "https://www.youtube.com/results?search_query=%EC%A0%9C%EC%9D%B4%EC%96%B4%EC%8A%A4%20%EB%82%98%EB%A5%BC%20%ED%96%A5%ED%95%9C%20%EC%A3%BC%EC%9D%98%20%EC%82%AC%EB%9E%91"}, {"artist": "어노인팅", "title": "푯대를 향하여", "yt": "https://www.youtube.com/results?search_query=%EC%96%B4%EB%85%B8%EC%9D%B8%ED%8C%85%20%ED%91%AF%EB%8C%80%EB%A5%BC%20%ED%96%A5%ED%95%98%EC%97%AC"}, {"artist": "스킷브래너 & 리바이즈", "title": "Way Maker", "yt": "https://www.youtube.com/results?search_query=%EC%8A%A4%ED%82%B7%EB%B8%8C%EB%9E%98%EB%84%88%20%26%20%EB%A6%AC%EB%B0%94%EC%9D%B4%EC%A6%88%20Way%20Maker"}, {"artist": "기프티드", "title": "주의 자녀로 산다는 것은", "yt": "https://www.youtube.com/results?search_query=%EA%B8%B0%ED%94%84%ED%8B%B0%EB%93%9C%20%EC%A3%BC%EC%9D%98%20%EC%9E%90%EB%85%80%EB%A1%9C%20%EC%82%B0%EB%8B%A4%EB%8A%94%20%EA%B2%83%EC%9D%80"}, {"artist": "마커스", "title": "호산나", "yt": "https://www.youtube.com/results?search_query=%EB%A7%88%EC%BB%A4%EC%8A%A4%20%ED%98%B8%EC%82%B0%EB%82%98"}, {"artist": "마커스", "title": "주가 주 되심을", "yt": "https://www.youtube.com/results?search_query=%EB%A7%88%EC%BB%A4%EC%8A%A4%20%EC%A3%BC%EA%B0%80%20%EC%A3%BC%20%EB%90%98%EC%8B%AC%EC%9D%84"}, {"artist": "홍이삭", "title": "하나님의 세계", "yt": "https://www.youtube.com/results?search_query=%ED%99%8D%EC%9D%B4%EC%82%AD%20%ED%95%98%EB%82%98%EB%8B%98%EC%9D%98%20%EC%84%B8%EA%B3%84"}, {"artist": "예수전도단", "title": "나는 자유해", "yt": "https://www.youtube.com/results?search_query=%EC%98%88%EC%88%98%EC%A0%84%EB%8F%84%EB%8B%A8%20%EB%82%98%EB%8A%94%20%EC%9E%90%EC%9C%A0%ED%95%B4"}, {"artist": "예수전도단", "title": "아름다우신", "yt": "https://www.youtube.com/results?search_query=%EC%98%88%EC%88%98%EC%A0%84%EB%8F%84%EB%8B%A8%20%EC%95%84%EB%A6%84%EB%8B%A4%EC%9A%B0%EC%8B%A0"}, {"artist": "지선", "title": "충만", "yt": "https://www.youtube.com/results?search_query=%EC%A7%80%EC%84%A0%20%EC%B6%A9%EB%A7%8C"}, {"artist": "제이어스", "title": "Born Again", "yt": "https://www.youtube.com/results?search_query=%EC%A0%9C%EC%9D%B4%EC%96%B4%EC%8A%A4%20Born%20Again"}, {"artist": "위러브", "title": "어둔 날 다 지나고", "yt": "https://www.youtube.com/results?search_query=%EC%9C%84%EB%9F%AC%EB%B8%8C%20%EC%96%B4%EB%91%94%20%EB%82%A0%20%EB%8B%A4%20%EC%A7%80%EB%82%98%EA%B3%A0"}, {"artist": "isaiah6tyone", "title": "하나님께서 세상을 사랑하사", "yt": "https://www.youtube.com/results?search_query=isaiah6tyone%20%ED%95%98%EB%82%98%EB%8B%98%EA%BB%98%EC%84%9C%20%EC%84%B8%EC%83%81%EC%9D%84%20%EC%82%AC%EB%9E%91%ED%95%98%EC%82%AC"}, {"artist": "마커스워십", "title": "하늘의 것을 구하게 하소서", "yt": "https://www.youtube.com/results?search_query=%EB%A7%88%EC%BB%A4%EC%8A%A4%EC%9B%8C%EC%8B%AD%20%ED%95%98%EB%8A%98%EC%9D%98%20%EA%B2%83%EC%9D%84%20%EA%B5%AC%ED%95%98%EA%B2%8C%20%ED%95%98%EC%86%8C%EC%84%9C"}, {"artist": "예수전도단", "title": "주와 같이 길 가는 것", "yt": "https://www.youtube.com/results?search_query=%EC%98%88%EC%88%98%EC%A0%84%EB%8F%84%EB%8B%A8%20%EC%A3%BC%EC%99%80%20%EA%B0%99%EC%9D%B4%20%EA%B8%B8%20%EA%B0%80%EB%8A%94%20%EA%B2%83"}, {"artist": "어노인팅", "title": "나의 백성이", "yt": "https://www.youtube.com/results?search_query=%EC%96%B4%EB%85%B8%EC%9D%B8%ED%8C%85%20%EB%82%98%EC%9D%98%20%EB%B0%B1%EC%84%B1%EC%9D%B4"}];
let current = songs.slice();
let next = [];
let index = 0;
let roundName = "32강";

function render() {
  if (current.length === 1) return finish(current[0]);
  const a=current[index], b=current[index+1];
  document.getElementById('aArtist').textContent=a.artist;
  document.getElementById('aTitle').textContent=a.title;
  document.getElementById('aListen').href=a.yt;
  document.getElementById('bArtist').textContent=b.artist;
  document.getElementById('bTitle').textContent=b.title;
  document.getElementById('bListen').href=b.yt;
  const totalMatches=current.length/2;
  const matchNo=index/2+1;
  document.getElementById('round').textContent=roundName;
  document.getElementById('hint').textContent=`${matchNo} / ${totalMatches} 번째 대결`;
  document.getElementById('bar').style.width=((index/2)/totalMatches*100)+"%";
}
function pick(which) {
  next.push(current[index+which]);
  index += 2;
  if(index >= current.length) {
    current=next; next=[]; index=0;
    if(current.length>1) roundName = current.length+"강";
  }
  render();
}
function finish(song) {
  document.getElementById('game').style.display='none';
  document.getElementById('result').style.display='block';
  document.getElementById('winner').textContent=song.title;
  document.getElementById('winnerArtist').textContent=song.artist;
  document.getElementById('winnerListen').href=song.yt;
}
render();
</script>
</body>
</html>
